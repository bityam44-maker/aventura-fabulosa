<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventura Fabulosa</title>
  <style>
    :root { 
      --azul:#2f80ed; 
      --azul-claro:#e3f0ff; 
      --amarillo:#ffc940; 
      --verde:#3ccf7a; 
      --rojo:#ff6b6b; 
      --blanco:#fff; 
      --texto:#1f2d4d; 
    } 
    * { box-sizing: border-box; margin: 0; padding: 0; } 
    body { 
      font-family:"Comic Sans MS","Trebuchet MS",Verdana,sans-serif; 
      font-size:1.15rem; 
      line-height:1.6; 
      color:var(--texto); 
      background:var(--azul-claro); 
    } 
    h1,h2,h3 { line-height:1.2; } 
    section { padding:3.5rem 1.2rem; } 
    .contenedor { max-width:1100px; margin:0 auto; } 
    .titulo-seccion { text-align:center; font-size:2.2rem; margin-bottom:2rem; color:var(--azul); } 
    
    header { 
      background:var(--azul); 
      color:var(--blanco); 
      position:sticky; 
      top:0; 
      z-index:10; 
      box-shadow:0 4px 0 var(--amarillo); 
    } 
    .barra { 
      max-width:1100px; 
      margin:0 auto; 
      padding:.8rem 1.2rem; 
      display:flex; 
      flex-wrap:wrap; 
      align-items:center; 
      justify-content:space-between; 
      gap:.6rem; 
    } 
    .logo { display:flex; align-items:center; gap:.6rem; font-size:1.7rem; font-weight:bold; } 
    .logo-icono { 
      width:48px; 
      height:48px; 
      border-radius:50%; 
      background:var(--amarillo); 
      display:grid; 
      place-items:center; 
      overflow:hidden; 
      animation:rebote 2s infinite; 
    } 
    .logo-icono img { width:100%; height:100%; object-fit:cover; object-position:28% 20%; transform:scale(2.6); } 
    
    nav ul { list-style:none; display:flex; flex-wrap:wrap; gap:.5rem; } 
    nav a { 
      color:var(--blanco); 
      text-decoration:none; 
      font-weight:bold; 
      padding:.45rem 1rem; 
      border-radius:999px; 
      transition:.2s; 
    } 
    nav a:hover { background:var(--amarillo); color:var(--azul); } 

    /* HERO PRINCIPAL CON VIDEO */
    .hero { 
      background:linear-gradient(135deg,var(--azul),#56a8ff); 
      color:var(--blanco); 
      text-align:center; 
      padding:3.5rem 1.2rem; 
    } 
    .hero h2 { font-size:clamp(2rem,6vw,3.2rem); margin-bottom:.5rem; } 
    .hero p { max-width:700px; margin:0 auto 1.5rem; font-size:1.25rem; } 
    
    /* TARJETA DEL REPRODUCTOR PRINCIPAL */
    .tarjeta-video-principal { 
      background: var(--blanco); 
      border-radius: 28px; 
      padding: 1.5rem; 
      border: 6px solid var(--amarillo); 
      box-shadow: 0 10px 0 rgba(0,0,0,.18); 
      max-width: 900px; 
      margin: 0 auto 1.8rem; 
      text-align: center; 
      color: var(--texto);
    } 
    .tarjeta-video-principal h3 { color: var(--azul); font-size: 1.8rem; margin-bottom: .3rem; } 
    .tarjeta-video-principal p { font-size: 1.1rem; color: #555; margin-bottom: .8rem; } 
    .contenedor-video { 
      position: relative; 
      aspect-ratio: 16/9; 
      width: 100%; 
      border-radius: 18px; 
      overflow: hidden; 
      background: #000; 
    } 
    .contenedor-video iframe, .contenedor-video video { width: 100%; height: 100%; border: 0; } 

    .boton { 
      display:inline-block; 
      background:var(--amarillo); 
      color:var(--texto); 
      font-size:1.3rem; 
      font-weight:bold; 
      text-decoration:none; 
      border:none; 
      cursor:pointer; 
      padding:.9rem 2rem; 
      border-radius:999px; 
      box-shadow:0 5px 0 #d9a21a; 
      transition:transform .15s; 
      font-family:inherit; 
    } 
    .boton:hover { transform:translateY(-3px); } 

    .cuadricula { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1.5rem; } 
    .tarjeta { 
      background:var(--blanco); 
      border-radius:24px; 
      padding:1.5rem; 
      text-align:center; 
      border:4px solid transparent; 
      box-shadow:0 6px 0 rgba(0,0,0,.08); 
      transition:.2s; 
    } 
    .tarjeta:nth-child(1){border-color:var(--amarillo);} 
    .tarjeta:nth-child(2){border-color:var(--verde);} 
    .tarjeta:nth-child(3){border-color:var(--rojo);} 
    .tarjeta:nth-child(4){border-color:#a066e8;} 
    .tarjeta:nth-child(5){border-color:var(--azul);} 
    .tarjeta:hover { transform:translateY(-6px) rotate(-1deg); } 
    .tarjeta h3 { color:var(--azul); margin-bottom:.5rem; } 

    .juego { background:var(--blanco); } 
    .pestanas { display:flex; flex-wrap:wrap; justify-content:center; gap:.6rem; margin-bottom:1.5rem; } 
    .pestana { 
      font-family:inherit; 
      font-size:1.15rem; 
      font-weight:bold; 
      padding:.6rem 1.4rem; 
      border-radius:999px; 
      border:3px solid var(--azul); 
      background:var(--blanco); 
      color:var(--azul); 
      cursor:pointer; 
    } 
    .pestana.activa { background:var(--azul); color:var(--blanco); } 
    .panel[hidden] { display:none; } 
    
    .marco { 
      max-width:900px; 
      margin:0 auto; 
      border:5px solid var(--azul); 
      border-radius:24px; 
      overflow:hidden; 
      background:var(--azul-claro); 
    } 
    .marco iframe { width:100%; height:520px; border:0; display:block; } 

    .actividades { 
      background:var(--verde); 
      color:var(--blanco); 
      text-align:center; 
      border-radius:32px; 
      padding:3rem 1.5rem; 
      max-width:900px; 
      margin:0 auto; 
    } 
    .actividades h2 { font-size:2.2rem; margin-bottom:.8rem; } 
    .actividades p { margin-bottom:1.5rem; } 

    .contacto { text-align:center; } 
    .contacto a { color:var(--azul); font-weight:bold; } 

    footer { background:var(--texto); color:var(--blanco); text-align:center; padding:2rem 1rem; font-size:1rem; } 
    footer a { color:var(--amarillo); margin:0 .5rem; } 

    @keyframes rebote { 
      0%,100%{transform:translateY(0);} 
      50%{transform:translateY(-6px);} 
    } 
    @media (max-width:600px){ 
      .barra{justify-content:center;} 
      .marco iframe{height:440px;} 
    } 
  </style>
</head>
