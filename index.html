<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventura Fabulosa - Estudiantes</title>
  <style>
    :root {
      --azul: #2f80ed;
      --azul-claro: #e3f0ff;
      --amarillo: #ffc940;
      --verde: #3ccf7a;
      --rojo: #ff6b6b;
      --blanco: #fff;
      --texto: #1f2d4d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; }
    body { background-color: var(--azul-claro); color: var(--texto); display: flex; flex-direction: column; min-height: 100vh; }
    header { background-color: var(--azul); color: var(--blanco); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    header h1 { font-size: 1.8rem; }
    nav a { color: var(--blanco); text-decoration: none; margin-left: 1.5rem; font-weight: bold; font-size: 1.1rem; }
    nav a:hover { color: var(--amarillo); }
    main { flex: 1; max-width: 1000px; width: 100%; margin: 2rem auto; padding: 0 1rem; }
    .seccion-diaria { background: var(--blanco); border: 4px solid var(--azul); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; text-align: center; box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
    .seccion-diaria h2 { color: var(--azul); font-size: 2rem; margin-bottom: 0.5rem; }
    .seccion-diaria p { font-size: 1.1rem; margin-bottom: 1.5rem; color: #555; }
    .tarjetas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
    .tarjeta { background: var(--blanco); border: 3px solid var(--amarillo); border-radius: 15px; padding: 1.5rem; text-align: left; box-shadow: 0 4px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
    .tarjeta h3 { color: var(--azul); margin-bottom: 0.5rem; font-size: 1.3rem; }
    .tarjeta p { font-size: 1rem; margin-bottom: 1rem; color: #444; }
    .video-yt { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; margin-bottom: 1rem; border-radius: 10px; overflow: hidden; background: #000; }
    .video-yt iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .boton { display: inline-block; background-color: var(--amarillo); color: var(--texto); padding: 0.6rem 1.2rem; border-radius: 25px; text-decoration: none; font-weight: bold; text-align: center; transition: background 0.2s; }
    .boton:hover { background-color: #ffd86b; }
    footer { background-color: var(--azul); color: var(--blanco); text-align: center; padding: 1rem; margin-top: auto; font-size: 1rem; }
  </style>
</head>
<body>

  <header>
    <h1>🦸‍♀️ Aventura Fabulosa</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="admin.html">Administración</a>
    </nav>
  </header>

  <main>
    <section class="seccion-diaria">
      <h2>📅 Video Informativo / Actividades del Día</h2>
      <p>Aquí encontrarás el video diario con las orientaciones de las actividades de hoy.</p>
      <div id="av-lista-informativos">
        <p>Cargando video informativo...</p>
      </div>
    </section>

    <section>
      <h2>🌟 Todos los Recursos</h2>
      <div id="av-lista-recursos" class="tarjetas-grid">
        <p>Cargando recursos...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>Aventura Fabulosa &copy; 2026 - Entorno Educativo Seguro</p>
  </footer>

  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const AV_SUPABASE_URL = 'https://onnzstykkintecvfkauz.supabase.co';
    const AV_SUPABASE_KEY = 'sb_publishable_sWD1DpzQXJheMn5T1sLB1g_bo2sUMFH';
    const avSb = window.supabase.createClient(AV_SUPABASE_URL, AV_SUPABASE_KEY);

    function avYoutubeEmbed(url) {
      if (!url) return null;
      let m;
      if ((m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([\w-]{11})/))) {
        return 'https://www.youtube.com/embed/' + m[1];
      }
      if ((m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/)) || (m = url.match(/drive\.google\.com\/open\?id=([\w-]+)/))) {
        return 'https://drive.google.com/file/d/' + m[1] + '/preview';
      }
      return null;
    }

    async function avCargarRecursos() {
      const zona = document.getElementById('av-lista-recursos');
      const informativos = document.getElementById('av-lista-informativos');
      if (!zona) return;
      
      const r = await avSb.from('recursos').select('*').eq('publicado', true).order('creado_en', { ascending: false });
      if (r.error) {
        zona.innerHTML = '<p>Error al cargar el contenido.</p>';
        return;
      }
      
      if (informativos) informativos.innerHTML = '';
      zona.innerHTML = '';
      
      if (!r.data || r.data.length === 0) {
        zona.innerHTML = '<p>No hay contenido disponible por el momento.</p>';
        if (informativos) informativos.innerHTML = '<p>No hay videos informativos hoy.</p>';
        return;
      }

      r.data.forEach(x => {
        const art = document.createElement('article');
        art.className = 'tarjeta';
        const emb = avYoutubeEmbed(x.url);
        
        art.innerHTML = '<h3>' + x.titulo + '</h3>' +
          '<p>' + ((x.descripcion || '').replace(/[<>]/g, '')) + '</p>' + 
          (emb ? 
            '<div class="video-yt"><iframe src="' + emb + '" title="' + x.titulo.replace(/"/g, '') + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>' : 
            (x.url ? '<a class="boton" href="' + x.url + '" target="_blank" rel="noopener">Abrir recurso</a>' : '')
          );
        
        if (x.categoria === 'Videos informativos' && informativos) {
          informativos.appendChild(art);
        } else {
          zona.appendChild(art);
        }
      });
    }

    avCargarRecursos();
  </script>
</body>
</html>
