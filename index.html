<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventura Fabulosa</title>
  <style>
    :root { 
      --azul: #2f80ed; 
      --azul-claro: #e3f0ff; 
      --amarillo: #ffc940; 
      --verde: #3ccf7a; 
      --rojo: #ff6b6b; 
      --blanco: #fff; 
      --texto: #1f2d4d; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: "Comic Sans MS", "Trebuchet MS", Verdana, sans-serif; 
      font-size: 1.15rem; 
      line-height: 1.6;
      color: var(--texto); 
      background: var(--azul-claro); 
    }
    h1, h2, h3 { line-height: 1.2; }
    section { padding: 3.5rem 1.2rem; }
    .contenedor { max-width: 1100px; margin: 0 auto; }
    .titulo-seccion { text-align: center; font-size: 2.2rem; margin-bottom: 2rem; color: var(--azul); }
    
    header { 
      background: var(--azul); 
      color: var(--blanco); 
      position: sticky; 
      top: 0; 
      z-index: 10; 
      box-shadow: 0 4px 0 var(--amarillo); 
    }
    .barra { 
      max-width: 1100px; 
      margin: 0 auto; 
      padding: .8rem 1.2rem; 
      display: flex; 
      flex-wrap: wrap; 
      align-items: center; 
      justify-content: space-between; 
      gap: .6rem; 
    }
    .logo { display: flex; align-items: center; gap: .6rem; font-size: 1.7rem; font-weight: bold; }
    .logo-icono { 
      width: 48px; 
      height: 48px; 
      border-radius: 50%; 
      background: var(--amarillo); 
      display: grid; 
      place-items: center; 
      overflow: hidden; 
      animation: rebote 2s infinite; 
    }
    .logo-icono img { width: 100%; height: 100%; object-fit: cover; object-position: 28% 20%; transform: scale(2.6); }
    
    nav ul { list-style: none; display: flex; flex-wrap: wrap; gap: .5rem; }
    nav a { 
      color: var(--blanco); 
      text-decoration: none; 
      font-weight: bold; 
      padding: .45rem 1rem; 
      border-radius: 999px; 
      transition: .2s; 
    }
    nav a:hover { background: var(--amarillo); color: var(--azul); }

    .hero { 
      background: linear-gradient(135deg, var(--azul), #56a8ff); 
      color: var(--blanco); 
      text-align: center; 
      padding: 4.5rem 1.2rem; 
    }
    .hero h2 { font-size: clamp(2rem, 6vw, 3.4rem); margin-bottom: 1rem; }
    .hero p { max-width: 650px; margin: 0 auto 1.5rem; font-size: 1.3rem; }

    .banner { 
      width: 100%; 
      max-width: 1000px; 
      height: auto; 
      display: block; 
      margin: 0 auto 1.8rem; 
      border-radius: 28px; 
      border: 6px solid var(--amarillo); 
      box-shadow: 0 8px 0 rgba(0,0,0,.18); 
    }

    /* TARJETA DEL VIDEO DESTACADO EN LA PORTADA */
    .tarjeta-video-principal { 
      background: var(--blanco); 
      border-radius: 24px; 
      padding: 1.5rem; 
      border: 4px solid var(--amarillo); 
      box-shadow: 0 8px 0 rgba(0,0,0,.08); 
      max-width: 900px; 
      margin: 0 auto 2rem; 
      text-align: center; 
      color: var(--texto);
    } 
    .tarjeta-video-principal h3 { color: var(--azul); font-size: 1.8rem; margin-bottom: .4rem; } 
    .tarjeta-video-principal p { font-size: 1.1rem; color: #555; margin-bottom: .8rem; } 
    .contenedor-video-unico { 
      position: relative; 
      aspect-ratio: 16/9; 
      width: 100%; 
      border-radius: 16px; 
      overflow: hidden; 
      background: #000; 
      margin-top: .8rem; 
    }
